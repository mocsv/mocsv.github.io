<head>
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

<meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}">
<meta name="keywords" content="blog, preparedness, emergency, prepping, UK prepper, disaster response, privacy, security, safety, survival, self-reliance, bug out, SHTF, diy, at home, craft, woodworking, sustainable, reuse">
<meta name="author" content="MOCSV">

  <link rel="canonical" href="{{ page.url | absolute_url }}">

  
  <!-- CSS -->
  <link rel="stylesheet" href="{{ "/public/css/poole.css" | relative_url}}">
  <link rel="stylesheet" href="{{ "/public/css/syntax.css" | relative_url}}">
  <link rel="stylesheet" href="{{ "/public/css/hyde.css" | relative_url}}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;700;900&display=swap" rel="stylesheet">


  <!-- Icons -->
  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ site.baseurl }}public/apple-touch-icon-144-precomposed.png">
                                 <link rel="shortcut icon" href="{{ site.baseurl }}public/favicon.ico">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="/atom.xml">
</head>
